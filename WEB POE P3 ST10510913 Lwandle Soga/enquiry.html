    <main id="main">
        <h2>Volunteer &amp; Enquiry Form</h2>
        <p style="text-align:center;">Want to volunteer or donate? Fill in your details below.</p>

       <form id="enquiryForm" action="mailto:info@tcyouthcenter.org.za" method="post"></form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" autocomplete="name" required>

            <label for="cell">Cell Number:</label>
            <input type="tel" id="cell" name="cell" placeholder="e.g. 0821234567"
                   pattern="0[0-9]{9}" inputmode="numeric" autocomplete="tel" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="message">Message / How would you like to help?</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">Send Enquiry</button>
        </form>
    </main>

    <footer>

    </footer>
